  <!-- Bütçem Header Wallet Icon (Scaled down slightly as requested) -->
  <g transform="translate(92, 92) scale(0.64)" stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Wallet Body -->
    <rect x="96" y="136" width="260" height="240" rx="46" stroke-width="28" />

    <!-- Top Horizontal Pocket Line -->
    <line x1="156" y1="200" x2="276" y2="200" stroke-width="26" />

    <!-- Outer Right Clasp / Strap -->
